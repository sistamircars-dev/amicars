# AMIRCARS en Render — https://amircars.onrender.com
# Start command recomendado (Settings): gunicorn --config gunicorn.conf.py wsgi:app
services:
  - type: web
    name: amircars
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn.conf.py wsgi:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: FLASK_DEBUG
        value: "0"
      - key: FORCE_HTTPS
        value: "true"
      - key: COOKIE_SECURE
        value: "true"
      - key: WEB_CONCURRENCY
        value: "1"
      - key: FLASK_SECRET_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: CLOUDINARY_URL
        sync: false
