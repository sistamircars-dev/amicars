# AMIRCARS — Flask/Python (Koyeb). No hace falta subir .venv ni node_modules.
name: Python check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version-file: runtime.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - run: python -c "from wsgi import app; assert app is not None"
